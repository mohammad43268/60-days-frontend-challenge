<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Animations Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&family=Syne:wght@600;800&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scroll-progress"></div>

    <section class="hero">
      <div class="glass-panel scale-up">
        <h1>Scroll</h1>
        <p>A CSS-only visual journey.</p>
      </div>
      <img
        src="https://i.pinimg.com/736x/cc/d4/a4/ccd4a40ed7b2e2004381eddcaa34c4f4.jpg"
        class="floating-doodle doodle-1 scroll-rotate-3d"
        alt="doodle" />
      <img
        src="https://i.pinimg.com/736x/ec/92/15/ec9215a4198316b288a9a5eca17348e6.jpg"
        class="floating-doodle doodle-2 scroll-parallax-bg"
        alt="doodle" />
    </section>

    <section class="bento-section">
      <h2 class="reveal-text">The Bento Grid</h2>
      <div class="bento-grid">
        <div class="bento-item glass-panel span-2x2 scroll-pop">
          <img
            src="https://i.pinimg.com/1200x/14/9f/c7/149fc77b1f039b058cbf6c3c1d108430.jpg"
            alt="doodle" />
        </div>
        <div class="bento-item glass-panel scroll-pop-delay-1">
          <img
            src="https://i.pinimg.com/736x/27/a7/a8/27a7a8d3bf3f18083dd8da6ca7d0c64f.jpg"
            alt="doodle" />
        </div>
        <div class="bento-item glass-panel scroll-pop-delay-2">
          <img
            src="https://i.pinimg.com/736x/30/64/e2/3064e2040c247cf0262f203f4614ef5c.jpg"
            alt="doodle" />
        </div>
        <div class="bento-item glass-panel span-col-2 scroll-pop-delay-3">
          <img
            src="https://i.pinimg.com/1200x/96/28/7a/96287ae84a971bae51c7ab3a335330ce.jpg"
            alt="doodle" />
        </div>
        <div class="bento-item glass-panel scroll-pop-delay-1">
          <img
            src="https://i.pinimg.com/1200x/8b/c0/4a/8bc04a6df0292667497c02471feb82db.jpg"
            alt="doodle" />
        </div>
      </div>
    </section>

    <section class="parallax-section">
      <h2 class="reveal-text">Animated characters</h2>
      <div class="parallax-container">
        <div class="parallax-card glass-panel scroll-3d-slide-right">
          <img
            src="https://i.pinimg.com/736x/48/ce/e5/48cee53203651dae8f3229fd4739c3f8.jpg"
            alt="doodle" />
          <h3>Vibrant Energy</h3>
        </div>
        <div class="parallax-card glass-panel scroll-3d-slide-left">
          <img
            src="https://i.pinimg.com/736x/01/bd/cc/01bdcc959a424d16f98728163813e4ed.jpg"
            alt="doodle" />
          <h3>Fluid Shapes</h3>
        </div>
      </div>
    </section>

    <section class="finale-section">
      <div class="glass-panel scroll-3d-flip">
        <h2 class="gradient-text">Unleash Creativity.</h2>
        <img
          src="https://i.pinimg.com/originals/05/94/cd/0594cd14ee116b3bd6c4b0b28b0e295c.jpg"
          alt="doodle"
          class="hero-image scroll-inner-scale" />
      </div>
    </section>
  </body>
</html>
