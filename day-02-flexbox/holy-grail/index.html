<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holy Grail Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Holy Grail Layout</h1>
    </header>

    <div class="main_section">
      <aside class="left_aside">
        <h2>Navigation</h2>
        <p>Dashboard</p>
        <p>Projects</p>
        <p>Analytics</p>
        <p>Settings</p>
      </aside>

      <main>
        <div class="hero-card">
          <div class="hero-image">
            <div class="shine"></div>

            <img
              src="https://th.bing.com/th/id/OIP.la0THWDZ6dcvwgCt_QvqcgHaEK?w=324&h=182&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"
              alt="workspace" />
          </div>

          <div class="hero-content">
            <h1>Modern Layout Design</h1>

            <p>
              Responsive Holy Grail Layout built using Flexbox, Glassmorphism
              and modern UI design.
            </p>

            <button>Explore More</button>
          </div>
        </div>
      </main>

      <aside class="right_aside">
        <h2>Status</h2>
        <p>Performance: good</p>
        <p>Users: 12.5K</p>
        <p>Project</p>
      </aside>
    </div>

    <footer>
      <p>Built with HTML & CSS</p>
    </footer>
  </body>
</html>
