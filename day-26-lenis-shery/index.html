<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automotive 3D Experience</title>
    <link rel="stylesheet" href="https://unpkg.com/sheryjs/dist/Shery.css" />
  </head>
  <body>
    <div class="custom-cursor"></div>
    <svg class="bg-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <circle
        cx="50"
        cy="50"
        r="40"
        stroke="rgba(255,255,255,0.03)"
        stroke-width="0.5"
        fill="none" />
      <circle
        cx="50"
        cy="50"
        r="30"
        stroke="rgba(255,255,255,0.02)"
        stroke-width="1"
        fill="none" />
      <path
        d="M0,50 Q25,25 50,50 T100,50"
        stroke="rgba(255,255,255,0.04)"
        stroke-width="0.2"
        fill="none" />
    </svg>

    <script
      type="module"
      src="https://unpkg.com/@splinetool/viewer@1.12.98/build/spline-viewer.js"></script>

    <main class="smooth-scroll-wrapper">
      <section class="section spline-section">
        <div class="spline-wrapper">
          <spline-viewer
            url="https://prod.spline.design/LEFxNTQMII51q5GJ/scene.splinecode"></spline-viewer>
        </div>
        <div class="watermark-blocker"></div>
      </section>

      <section class="section gallery-section">
        <div class="shery-item item-1">
          <img src="/img1.jpg" alt="Gallery" />
          <img src="/img2.jpg" alt="Gallery" />
        </div>

        <div class="shery-item item-2">
          <img src="/img3.jpg" alt="Gallery" />
          <img src="/img4.jpg" alt="Gallery" />
        </div>

        <div class="shery-item item-3">
          <img src="/img5.jpg" alt="Gallery" />
          <img src="/img6.jpg" alt="Gallery" />
        </div>

        <div class="shery-item item-4">
          <img src="/img7.jpg" alt="Gallery" />
          <img src="/img8.jpg" alt="Gallery" />
        </div>

        <div class="shery-item item-5">
          <img src="/img9.jpg" alt="Gallery" />
          <img src="/img10.jpg" alt="Gallery" />
        </div>

        <div class="shery-item item-6">
          <img src="/img11.jpg" alt="Gallery" />
          <img src="/img12.jpg" alt="Gallery" />
        </div>
      </section>

      <section class="section pin-section">
        <div class="pin-wrap">
          <div class="pin-panel"><h1>PRECISION</h1></div>
          <div class="pin-panel"><h1>MOTION</h1></div>
          <div class="pin-panel"><h1 class="outline">AESTHETIC</h1></div>
        </div>
      </section>

      <footer class="footer">
        <div class="footer-content">
          <h2 class="footer-title">HUZAIFA AUTOMATION</h2>
          <div class="footer-links">
            <a href="#">INSTAGRAM</a>
            <a href="#">DRIBBBLE</a>
            <a href="#">CONTACT</a>
          </div>
          <img class="footer-img" src="/img12.jpg" alt="Footer" />
        </div>
      </footer>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.155.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/sheryjs/dist/Shery.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
