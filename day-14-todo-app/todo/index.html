<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow | Organize your work</title>
    <meta
      name="description"
      content="A premium SaaS-style task management dashboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="hero">
          <h1 class="hero-title">
            TASK<span class="gradient-text">FLOW</span>
          </h1>
          <p class="hero-subtitle">
            Organize your work. Focus on what matters.
          </p>
        </div>

        <div class="stats-dashboard">
          <div class="stat-card">
            <span class="stat-label">Total</span>
            <span class="stat-value" id="stat-total">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Completed</span>
            <span class="stat-value" id="stat-completed">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Pending</span>
            <span class="stat-value" id="stat-pending">0</span>
          </div>
          <div class="progress-container" aria-label="Task completion progress">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <span class="progress-text" id="progress-text">0%</span>
          </div>
        </div>
      </header>

      <main class="app-main">
        <section class="glass-panel form-section">
          <form id="task-form" aria-label="Add new task form">
            <div class="form-group row">
              <div class="input-wrapper flex-grow">
                <input
                  type="text"
                  id="task-title"
                  placeholder="Task title..."
                  required
                  aria-required="true"
                  autocomplete="off" />
              </div>
              <div class="input-wrapper">
                <select id="task-priority" aria-label="Select priority">
                  <option value="low">Low Priority</option>
                  <option value="medium" selected>Medium Priority</option>
                  <option value="high">High Priority</option>
                </select>
              </div>
            </div>
            <div class="form-group row">
              <div class="input-wrapper flex-grow">
                <input
                  type="text"
                  id="task-desc"
                  placeholder="Brief description (optional)"
                  autocomplete="off" />
              </div>
              <div class="input-wrapper">
                <input type="date" id="task-date" aria-label="Due date" />
              </div>
              <button type="submit" class="btn-primary">
                <svg
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4v16m8-8H4"></path>
                </svg>
                Add Task
              </button>
            </div>
          </form>
        </section>

        <section class="controls-section">
          <div class="search-wrapper">
            <svg
              class="search-icon"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input
              type="text"
              id="search-input"
              placeholder="Search tasks..."
              aria-label="Search tasks" />
          </div>
          <div class="filters-wrapper">
            <select id="filter-status" aria-label="Filter by status">
              <option value="all">All Tasks</option>
              <option value="active">Active</option>
              <option value="completed">Completed</option>
            </select>
            <select id="sort-tasks" aria-label="Sort tasks">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="priority">By Priority</option>
            </select>
          </div>
        </section>

        <section class="task-list-container" aria-live="polite">
          <ul id="task-list" class="task-list"></ul>

          <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon">✨</div>
            <h3>You're all caught up!</h3>
            <p>Add a new task above to get started.</p>
          </div>
        </section>
      </main>
    </div>

    <div id="toast-container" aria-live="assertive"></div>

    <script src="script.js"></script>
  </body>
</html>
