<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Reset Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>This is H1</h1>
  <h2>This is H2</h2>
  <h3>This is H3</h3>

  <p>
    This is a paragraph. Without reset, browsers add 
    their own margins and padding to these elements. 
    CSS reset removes all that so we start from zero.
  </p>

  <ul>
    <li>List item one</li>
    <li>List item two</li>
    <li>List item three</li>
  </ul>

  <button>Default Button</button>

  <a href="#">This is a link</a>

</body>
</html>
