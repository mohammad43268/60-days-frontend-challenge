<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium UI Animation Playground</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-badge">60 Days Frontend Challenge</div>
      <h1>Design System Masterclass</h1>
      <p>Curated by Mohammad Huzaifa</p>
    </header>

    <main>
      <section class="panel glass-panel">
        <div class="panel-header">
          <h3>Glassmorphism</h3>
          <span>Aero Interface</span>
        </div>

        <div class="glass-container">
          <div class="ambient-glow-1"></div>
          <div class="ambient-glow-2"></div>

          <div class="glass-widget widget-main">
            <div class="glass-avatar"></div>
            <div class="glass-line-long"></div>
            <div class="glass-line-short"></div>
          </div>

          <div class="glass-widget widget-secondary">
            <div class="glass-metric"></div>
            <div class="glass-metric"></div>
          </div>

          <div class="glass-action-pill"></div>
        </div>
      </section>

      <section class="panel clay-panel">
        <div class="panel-header">
          <h3>Claymorphism</h3>
          <span>3D Soft-Touch</span>
        </div>

        <div class="clay-container">
          <div class="clay-hero-shape"></div>

          <div class="clay-row">
            <div class="clay-btn-circle"></div>
            <div class="clay-btn-circle"></div>
            <div class="clay-btn-circle"></div>
          </div>

          <div class="clay-badge-slider">
            <div class="clay-slider-handle"></div>
          </div>
        </div>
      </section>

      <section class="panel neo-panel">
        <div class="panel-header">
          <h3>Neomorphism</h3>
          <span>Tactile Control</span>
        </div>

        <div class="neo-container">
          <div class="neo-display-window">
            <div class="neo-matrix-dots"></div>
          </div>

          <div class="neo-grid-controls">
            <button class="neo-square-btn"></button>
            <button class="neo-square-btn"></button>
            <button class="neo-square-btn"></button>
            <button class="neo-square-btn"></button>
          </div>

          <div class="neo-fader-track">
            <div class="neo-fader-cap"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
